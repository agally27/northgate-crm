<title>Northgate CRM Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --bg:#F3F5F4;--surface:#FFFFFF;--surface-2:#E9ECEB;--surface-3:#DFE3E1;--border:#D9DEDC;--border-strong:#C3CAC7;
  --text:#18201C;--muted:#5B6661;--faint:#8A938F;
  --accent:#1E5A8A;--accent-ink:#FFFFFF;--accent-soft:#E1ECF5;--accent-soft-ink:#164A72;
  --good:#257A4C;--good-soft:#DFF0E5;--warn:#A8701A;--warn-soft:#F7ECD3;--crit:#B4362E;--crit-soft:#F6DFDD;
  --st1:#2F6FB5;--st1-soft:#DEEAF7;--st2:#6A55A8;--st2-soft:#E8E2F5;--st3:#B57A16;--st3-soft:#F6E9CE;
  --shadow:0 1px 2px rgba(20,30,26,.06),0 6px 18px rgba(20,30,26,.06);
  --sidebar:#1B2A25;--sidebar-text:#C8D3CE;--sidebar-muted:#7F918A;--sidebar-active:#27423A;
  --radius:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111513;--surface:#191E1C;--surface-2:#202724;--surface-3:#2A322E;--border:#2B3430;--border-strong:#3B4641;
    --text:#E6EBE8;--muted:#A2ADA7;--faint:#6E7974;
    --accent:#6FB0E4;--accent-ink:#0E1A24;--accent-soft:#1A2E40;--accent-soft-ink:#A9D1F1;
    --good:#5DBF8A;--good-soft:#173124;--warn:#DBA648;--warn-soft:#3A2D12;--crit:#E3736A;--crit-soft:#3E1D1A;
    --st1:#6FA3E0;--st1-soft:#1A2B3F;--st2:#A594DC;--st2-soft:#2A2440;--st3:#DBA648;--st3-soft:#3A2D12;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    --sidebar:#0D1210;--sidebar-text:#B9C5BF;--sidebar-muted:#6C7A74;--sidebar-active:#1C2723;
  }
}
:root[data-theme="dark"]{
  --bg:#111513;--surface:#191E1C;--surface-2:#202724;--surface-3:#2A322E;--border:#2B3430;--border-strong:#3B4641;
  --text:#E6EBE8;--muted:#A2ADA7;--faint:#6E7974;
  --accent:#6FB0E4;--accent-ink:#0E1A24;--accent-soft:#1A2E40;--accent-soft-ink:#A9D1F1;
  --good:#5DBF8A;--good-soft:#173124;--warn:#DBA648;--warn-soft:#3A2D12;--crit:#E3736A;--crit-soft:#3E1D1A;
  --st1:#6FA3E0;--st1-soft:#1A2B3F;--st2:#A594DC;--st2-soft:#2A2440;--st3:#DBA648;--st3-soft:#3A2D12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --sidebar:#0D1210;--sidebar-text:#B9C5BF;--sidebar-muted:#6C7A74;--sidebar-active:#1C2723;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:24px}h2{font-size:17px}h3{font-size:14px}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.sidebar{background:var(--sidebar);color:var(--sidebar-text);padding:16px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.org{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius);margin-bottom:10px}
.org .mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#6FB0E4,#1E5A8A);display:grid;place-items:center;color:#fff;font-family:"Bricolage Grotesque",sans-serif;font-weight:700}
.org .name{font-weight:600;color:#fff;line-height:1.2}
.org .plan{font-size:11px;color:var(--sidebar-muted);letter-spacing:.04em;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius);color:var(--sidebar-text);font-weight:500}
.nav a:hover{background:rgba(255,255,255,.05)}
.nav a.active{background:var(--sidebar-active);color:#fff}
.nav a svg{width:17px;height:17px;flex:none;opacity:.85}
.nav .count{margin-left:auto;font-size:11px;background:rgba(255,255,255,.1);padding:1px 7px;border-radius:99px;color:#fff}
.nav .sect{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--sidebar-muted);padding:14px 10px 4px}
.sidebar .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:8px 10px;font-size:13px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 28px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:5}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid transparent;border-radius:var(--radius);padding:7px 12px;color:var(--muted);cursor:text}
.search:hover{border-color:var(--border-strong)}
.search kbd{margin-left:auto;font:11px/1 "IBM Plex Sans",sans-serif;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:3px 5px;color:var(--faint)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--radius);padding:7px 12px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.avatar{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:600;flex:none;background:var(--accent-soft);color:var(--accent-soft-ink)}
.avatar.lg{width:52px;height:52px;font-size:18px}
.avatar.c2{background:var(--st2-soft);color:var(--st2)}.avatar.c3{background:var(--st3-soft);color:var(--st3)}.avatar.c4{background:var(--good-soft);color:var(--good)}
.page{padding:24px 28px 48px;display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head .sub{color:var(--muted);margin-top:2px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--muted)}.crumb a:hover{color:var(--accent)}

/* cards & tables */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px}
.card .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.card .bd{padding:16px}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr{cursor:pointer}
.table tbody tr:hover td{background:var(--surface-2)}
.table .who{display:flex;align-items:center;gap:10px;font-weight:500}
.table .who small{display:block;color:var(--muted);font-weight:400}
.wrap{overflow-x:auto}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:500;line-height:1.5;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.acc{background:var(--accent-soft);color:var(--accent-soft-ink)}
.pill.s1{background:var(--st1-soft);color:var(--st1)}.pill.s2{background:var(--st2-soft);color:var(--st2)}.pill.s3{background:var(--st3-soft);color:var(--st3)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.tag{display:inline-block;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:1px 7px;font-size:12px;color:var(--muted);margin-right:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chip.on{background:var(--accent-soft);color:var(--accent-soft-ink);border-color:transparent;font-weight:500}
.chip:hover{border-color:var(--border-strong)}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .label{font-size:12px;color:var(--muted);font-weight:500}
.tile .value{font-family:"Bricolage Grotesque",sans-serif;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.tile .delta{font-size:12px;color:var(--muted)}
.tile .delta.up{color:var(--good)}.tile .delta.down{color:var(--crit)}
.grid2{display:grid;grid-template-columns:3fr 2fr;gap:16px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:120px 1fr 90px 40px;align-items:center;gap:12px;font-size:13px}
.bar .track{height:22px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;border-radius:5px;display:flex;align-items:center;padding-left:8px;font-size:11.5px;font-weight:600;color:#fff;min-width:28px}
.bar .val{text-align:right;font-weight:500}
.bar .n{text-align:right;color:var(--muted)}
.list{display:flex;flex-direction:column}
.list .row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.list .row:last-child{border-bottom:0}
.list .row:hover{background:var(--surface-2)}
.list .row .grow{flex:1;min-width:0}
.list .row .t{font-weight:500}
.list .row .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border-strong);background:var(--surface);display:grid;place-items:center;flex:none;padding:0}
.check.done{background:var(--good);border-color:var(--good);color:#fff}
.row.done .t{text-decoration:line-through;color:var(--muted)}

/* detail */
.detail{display:grid;grid-template-columns:300px 1fr 280px;gap:16px;align-items:start}
.dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:13.5px}
.dl dt{color:var(--muted)}.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.head-card{display:flex;align-items:center;gap:16px}
.head-card .title{flex:1;min-width:0}
.head-card .meta{color:var(--muted);margin-top:2px}
.composer{padding:12px 16px;border-bottom:1px solid var(--border)}
.tabs{display:flex;gap:2px;margin-bottom:8px}
.tabs button{border:0;background:transparent;padding:4px 10px;border-radius:6px;color:var(--muted);font-weight:500;font-size:13px}
.tabs button.on{background:var(--surface-2);color:var(--text)}
.composer textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius);padding:9px 11px;resize:vertical;min-height:58px;background:var(--surface)}
.composer .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.timeline{padding:6px 16px 12px}
.day{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:14px 0 6px}
.ev{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)}
.ev:last-child{border-bottom:0}
.ev .ico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.ev .ico svg{width:14px;height:14px}
.ev .ico.note{background:var(--st3-soft);color:var(--st3)}.ev .ico.call{background:var(--good-soft);color:var(--good)}.ev .ico.email{background:var(--st1-soft);color:var(--st1)}.ev .ico.meeting{background:var(--st2-soft);color:var(--st2)}
.ev .hd2{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ev .hd2 b{font-weight:600}
.ev .hd2 .when{color:var(--faint);font-size:12px;margin-left:auto}
.ev .body{color:var(--muted);margin-top:2px;white-space:pre-line}
.ev .rel{margin-top:4px;display:flex;gap:4px;flex-wrap:wrap}
.mini{display:flex;flex-direction:column;gap:8px}
.mini .it{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer}
.mini .it:hover{background:var(--surface-2)}
.mini .it .grow{flex:1;min-width:0}
.mini .it .t{font-weight:500;font-size:13px}
.mini .it .s{font-size:12px;color:var(--muted)}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:260px;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:start}
.col{background:var(--surface-2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col .ch{display:flex;align-items:center;gap:8px;padding:2px 4px 6px}
.col .ch .dot{width:8px;height:8px;border-radius:50%}
.col .ch b{font-weight:600}
.col .ch .n{color:var(--muted);font-size:12px}
.col .ch .sum{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.opp{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;cursor:grab;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.opp:active{cursor:grabbing}
.opp.dragging{opacity:.4}
.opp .t{font-weight:500;line-height:1.3}
.opp .co{font-size:12.5px;color:var(--muted);margin-top:2px}
.opp .ft{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px}
.opp .ft .v{font-weight:600}
.opp .ft .age{color:var(--faint);margin-left:auto}
.opp .stale{display:inline-flex;align-items:center;gap:4px;color:var(--warn);font-weight:500;font-size:12px}
.opp .stale svg{width:12px;height:12px}
.opp .av{display:flex;align-items:center;gap:6px}
.opp .avatar{width:20px;height:20px;font-size:9px}

/* tasks */
.groups{display:flex;flex-direction:column;gap:16px}
.group h3{display:flex;align-items:center;gap:8px;padding:0 0 8px}
.group h3 .n{font-size:12px;color:var(--muted);font-weight:500}
.group h3.crit{color:var(--crit)}
.prio{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.prio.high,.prio.urgent{color:var(--crit)}.prio.normal{color:var(--muted)}.prio.low{color:var(--faint)}

/* settings */
.stages{display:flex;flex-direction:column;gap:6px}
.stage{display:grid;grid-template-columns:18px 14px 1fr 90px 90px 80px;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.stage .grip{color:var(--faint);cursor:grab}
.stage .dot{width:12px;height:12px;border-radius:50%}
.stage input{border:1px solid transparent;background:transparent;border-radius:5px;padding:4px 6px;width:100%}
.stage input:hover{border-color:var(--border)}
.stage input:focus{border-color:var(--accent);background:var(--surface)}
.stage .k{font-size:12px;color:var(--muted)}
.settings-nav{display:flex;gap:6px;flex-wrap:wrap}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(10,14,12,.45);display:grid;place-items:start center;padding-top:12vh;z-index:20}
.panel{width:min(600px,92vw);background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.panel .in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.panel .in input{flex:1;border:0;background:transparent;font-size:16px;outline:0}
.results{max-height:50vh;overflow:auto;padding:6px}
.results .grp{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:10px 10px 4px;font-weight:600}
.results .r{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer}
.results .r:hover,.results .r.sel{background:var(--surface-2)}
.results .r .s{color:var(--muted);font-size:12.5px;margin-left:auto}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.form input,.form select{border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;background:var(--surface)}
.form .full{grid-column:1/-1}
.form .hint{grid-column:1/-1;display:flex;gap:8px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:var(--radius);padding:8px 10px;font-size:13px}
.panel .ft{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:500;box-shadow:var(--shadow);z-index:30}
.proto{position:fixed;right:14px;bottom:14px;font-size:11px;color:var(--faint);background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:4px 10px;z-index:4}

@media (max-width:1100px){.tiles{grid-template-columns:repeat(3,1fr)}.detail{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 8px;gap:2px;z-index:10;overflow-x:auto}
  .sidebar .org,.sidebar .sect,.sidebar .me,.nav .count{display:none}
  .nav{display:flex;flex:1;justify-content:space-around}
  .nav a{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 8px}
  .page{padding:16px 14px 90px}.topbar{padding:10px 14px}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .stage{grid-template-columns:18px 14px 1fr 70px}
  .stage .k:nth-last-child(-n+2){display:none}
}
@media (prefers-reduced-motion:no-preference){.opp,.chip,.btn{transition:background .12s,opacity .12s}}
</style>

<div class="app">
  <aside class="sidebar">
    <div class="org">
      <div class="mark">H</div>
      <div><div class="name">Harbour Design Studio</div><div class="plan">Starter plan</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="me"><span class="avatar">AG</span><div><div style="color:#fff;font-weight:500">Andy</div><div style="font-size:11px;color:var(--sidebar-muted)">Owner</div></div></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="search" id="searchBtn" role="button" tabindex="0">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Search contacts, companies, deals…</span><kbd>⌘K</kbd>
      </div>
      <span style="flex:1"></span>
      <button class="btn primary" id="newBtn">+ New contact</button>
    </header>
    <section id="view"></section>
  </div>
</div>
<div class="overlay" id="cmdk" hidden></div>
<div class="overlay" id="modal" hidden></div>
<div class="proto">Prototype · sample data · nothing is saved</div>

<script>
/* ---------- sample data (fictional studio, fictional people) ---------- */
const users = {ag:{n:'Andy',i:'AG',c:''},pn:{n:'Priya Nair',i:'PN',c:'c2'},to:{n:'Tom Okafor',i:'TO',c:'c3'}};
const companies = [
 {id:'c1',name:'Fairholme Property',domain:'fairholme.co.uk',industry:'Property',city:'Leeds',status:'customer',owner:'ag'},
 {id:'c2',name:'Brightwater Dental',domain:'brightwaterdental.co.uk',industry:'Healthcare',city:'Harrogate',status:'prospect',owner:'pn'},

    <tr><td><div class="who">${av('ag')}Andy</div></td><td>andy@harbourdesign.studio</td><td><span class="pill acc">Owner</span></td><td>Now</td></tr><tr><td><div class="who">${av('pn')}Priya Nair</div></td><td>priya@harbourdesign.studio</td><td><span class="pill neutral">Manager</span></td><td>Yesterday</td></tr><tr><td><div class="who">${av('to')}Tom Okafor</div></td><td>tom@harbourdesign.studio</td><td><span class="pill neutral">Member</span></td><td>3 days ago</td></tr></tbody></table></div></div>`;
  if (settingsTab==='general') body = `<div class="card"><div class="hd"><h2>Organisation</h2></div><div class="form" style="max-width:640px"><label>Name<input value="Harbour Design Studio"></label><label>Currency<select><option>GBP (£)</option><option>EUR (€)</option><option>USD ($)</option></select></label><label>Timezone<select><option>Europe/London</option></select></label><label>Date format<select><option>6 Sep 2026</option><option>06/09/2026</option></select></label><label class="full" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" style="width:auto"> Members can edit records they don't own</label><label class="full" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" style="width:auto"> Members can export</label></div><div class="ft"><button class="btn primary" onclick="toast('Saved')">Save</button></div></div>`;
  return `<div class="page"><div class="page-head"><div><h1>Settings</h1><div class="sub">Make the CRM fit how Harbour Design Studio works</div></div></div>
    <div class="settings-nav">${tabs.map(([k,l])=>`<button class="chip ${settingsTab===k?'on':''}" onclick="settingsTab='${k}';render()">${l}</button>`).join('')}</div>${body}</div>`;
}

/* ---------- actions ---------- */
function toggleTask(id){ const t = tasks.find(x=>x.id===id); t.done = !t.done; if (t.done) toast('Task completed'); render(); }
function addActivity(contactId){
  const text = $('#composerText').value.trim(); if (!text) return toast('Write something first');
  const c = ct(contactId);
  activities.unshift({id:'a'+Date.now(),type:composerTab,subject:{note:'Note',call:'Call with '+c.first,email:'Email to '+c.first,meeting:'Meeting with '+c.first}[composerTab],body:text,at:'2026-09-06T'+new Date().toTimeString().slice(0,5),who:'ag',contact:contactId,company:c.company,dir:'out'});
  c.last = '2026-09-06'; toast(`${composerTab[0].toUpperCase()+composerTab.slice(1)} logged`); render();
}
function convertLead(id){
  const l = ld(id); const [first,...rest] = l.name.split(' ');
  const cid = 'c'+Date.now(), pid = 'p'+Date.now();
  companies.push({id:cid,name:l.co,domain:l.email.split('@')[1],industry:'—',city:'—',status:'prospect',owner:'ag'});
  contacts.unshift({id:pid,first,last:rest.join(' '),email:l.email,phone:'',mobile:'',title:'',company:cid,status:'prospect',source:l.source,owner:'ag',tags:[],last:'2026-09-06'});
  opps.push({id:'o'+Date.now(),name:l.co+' — '+l.source+' enquiry',company:cid,contact:pid,value:0,stage:'qual',owner:'ag',close:'2026-10-06',entered:'2026-09-06'});
  activities.unshift({id:'a'+Date.now(),type:'system',subject:'Converted from lead',body:l.note,at:'2026-09-06T'+new Date().toTimeString().slice(0,5),who:'ag',contact:pid,company:cid});
  leads = leads.filter(x=>x.id!==id); tasks.forEach(t=>{ if(t.rel.lead===id){ delete t.rel.lead; t.rel.contact=pid; } });
  toast('Lead converted: contact, company and opportunity created'); go('#contacts/'+pid);
}
function moveOpp(id, stageId){
  const o = opp(id); if (o.stage === stageId) return;
  const from = stg(o.stage), to = stg(stageId);
  o.stage = stageId; o.entered = '2026-09-06';
  activities.unshift({id:'a'+Date.now(),type:'stage',subject:to.kind==='won'?'Won':to.kind==='lost'?'Lost':'Moved to '+to.n,body:`${from.n} → ${to.n}${to.kind!=='open'?' · '+gbp(o.value):''}`,at:'2026-09-06T'+new Date().toTimeString().slice(0,5),who:'ag',contact:o.contact,company:o.company,opp:o.id});
  if (to.kind==='won'){ o.close='2026-09-06'; const c = ct(o.contact); if (c) c.status='customer'; const cm = o.company?co(o.company):null; if (cm) cm.status='customer'; toast(`Won · ${gbp(o.value)} · ${c?full(c):''} is now a customer`); }
  else if (to.kind==='lost'){ o.close='2026-09-06'; toast('Marked as lost'); }
  else toast(`Moved to ${to.n}`);
  render();
}
function wireBoard(){
  let dragId = null;
  document.querySelectorAll('.opp').forEach(el => {
    el.addEventListener('dragstart', e => { dragId = el.dataset.id; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
  });
  document.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', e => { e.preventDefault(); col.classList.remove('over'); if (dragId) moveOpp(dragId, col.dataset.stage); dragId = null; });
  });
}

/* ---------- new contact modal ---------- */
function openNewContact(companyId=''){
  $('#modal').hidden = false;
  $('#modal').innerHTML = `<div class="panel" role="dialog" aria-label="New contact"><div class="in"><h2>New contact</h2><span style="flex:1"></span><button class="btn ghost small" onclick="closeModal()">Esc</button></div>
    <form class="form" onsubmit="return saveContact(event)">
      <label>First name<input name="first" required autofocus></label><label>Last name<input name="last"></label>
      <label>Email<input name="email" type="email" oninput="dupCheck(this.value)"></label><label>Mobile<input name="mobile"></label>
      <label>Company<select name="company"><option value="">— None —</option>${companies.map(c=>`<option value="${c.id}" ${c.id===companyId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>Job title<input name="title"></label>
      <label>Status<select name="status"><option>prospect</option><option>customer</option><option>other</option></select></label><label>Source<select name="source">${['Website','Referral','Phone','Email','Social','Event','Other'].map(s=>`<option>${s}</option>`).join('')}</select></label>
      <div class="hint" id="dup" hidden></div>
      <div class="ft full" style="padding:0;border:0"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save contact</button></div>
    </form></div>`;
  setTimeout(()=>$('#modal input')?.focus(), 30);
}
function dupCheck(v){ const d = contacts.find(c => c.email && c.email.toLowerCase() === v.trim().toLowerCase()); const el = $('#dup'); if (d){ el.hidden = false; el.innerHTML = `Possible duplicate: <a href="#contacts/${d.id}" onclick="closeModal()">${esc(full(d))}</a> already has this email.`; } else el.hidden = true; }
function saveContact(e){
  e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); const id = 'p'+Date.now();
  contacts.unshift({id,first:f.first,last:f.last,email:f.email,phone:'',mobile:f.mobile,title:f.title,company:f.company,status:f.status,source:f.source,owner:'ag',tags:[],last:'2026-09-06'});
  activities.unshift({id:'a'+Date.now(),type:'system',subject:'Contact created',body:'',at:'2026-09-06T'+new Date().toTimeString().slice(0,5),who:'ag',contact:id,company:f.company});
  closeModal(); toast('Contact saved'); go('#contacts/'+id); return false;
}
function closeModal(){ $('#modal').hidden = true; $('#modal').innerHTML=''; }

/* ---------- command palette ---------- */
function openSearch(){
  $('#cmdk').hidden = false;
  $('#cmdk').innerHTML = `<div class="panel"><div class="in">${icons.contacts.replace('<svg','<svg width="18" height="18"')}<input id="q" placeholder="Search people, companies, leads, opportunities…" autocomplete="off"></div><div class="results" id="res"></div></div>`;
  const q = $('#q'); q.focus(); q.addEventListener('input', () => searchRender(q.value)); searchRender('');
}
function searchRender(q){
  q = q.trim().toLowerCase(); const m = s => !q || s.toLowerCase().includes(q);
  const groups = [
    ['Contacts', contacts.filter(c => m(full(c)) || m(c.email) || m((c.phone+c.mobile).replace(/\s/g,'')) ).slice(0,5).map(c => ({h:`#contacts/${c.id}`,t:full(c),s:c.company?co(c.company).name:c.title,a:`<span class="avatar">${initials(c)}</span>`}))],
    ['Companies', companies.filter(c => m(c.name)||m(c.domain)).slice(0,4).map(c => ({h:`#companies/${c.id}`,t:c.name,s:c.industry,a:`<span class="avatar c3">${c.name.split(' ').map(w=>w[0]).join('').slice(0,2)}</span>`}))],
    ['Leads', leads.filter(l => m(l.name)||m(l.co)).slice(0,3).map(l => ({h:'#leads',t:l.name,s:l.co,a:`<span class="avatar c2">${l.name.split(' ').map(w=>w[0]).join('')}</span>`}))],
    ['Opportunities', opps.filter(o => m(o.name)).slice(0,4).map(o => ({h:'#opportunities',t:o.name,s:gbp(o.value)+' · '+stg(o.stage).n,a:`<span class="avatar c4">£</span>`}))],
  ].filter(([,r]) => r.length);
  $('#res').innerHTML = groups.map(([g,r]) => `<div class="grp">${g}</div>${r.map(x => `<div class="r" onclick="closeSearch();go('${x.h}')">${x.a}<span>${esc(x.t)}</span><span class="s">${esc(x.s)}</span></div>`).join('')}`).join('') || '<div class="empty">No matches.</div>';
}
function closeSearch(){ $('#cmdk').hidden = true; $('#cmdk').innerHTML=''; }

/* ---------- router ---------- */
function render(){
  const h = (location.hash || '#dashboard').slice(1); const [route, id] = h.split('/');
  renderNav(route);
  const views = {dashboard:vDashboard, contacts: () => id ? vContact(id) : vContacts(), companies: () => id ? vCompany(id) : vCompanies(), leads:vLeads, opportunities:vOpps, tasks:vTasks, activity:vActivity, settings:vSettings};
  $('#view').innerHTML = (views[route] || vDashboard)();
  if (route === 'opportunities') wireBoard();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);
$('#searchBtn').addEventListener('click', openSearch);
$('#newBtn').addEventListener('click', () => openNewContact());
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); $('#cmdk').hidden ? openSearch() : closeSearch(); }
  if (e.key === 'Escape'){ closeSearch(); closeModal(); }
});
$('#cmdk').addEventListener('click', e => { if (e.target === $('#cmdk')) closeSearch(); });
$('#modal').addEventListener('click', e => { if (e.target === $('#modal')) closeModal(); });
render();
</script>
